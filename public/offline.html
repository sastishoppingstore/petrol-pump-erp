<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>Offline — Mehar Filling Station ERP</title>
    <link rel="icon" href="/icons/icon-192.png" type="image/png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #e2e8f0;
            background: linear-gradient(160deg, #0f172a 0%, #020617 70%);
        }
        .card {
            max-width: 420px; width: 100%; text-align: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 36px 28px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(14px);
        }
        .badge {
            width: 84px; height: 84px; margin: 0 auto 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 42px; border-radius: 22px;
            background: linear-gradient(140deg, #ef4444, #f97316);
            box-shadow: 0 12px 30px rgba(249, 115, 22, 0.35);
        }
        h1 { font-size: 22px; margin-bottom: 8px; color: #fff; }
        p { font-size: 14px; line-height: 1.65; color: #94a3b8; margin-bottom: 10px; }
        .urdu { font-size: 15px; color: #cbd5e1; }
        .btn {
            display: inline-block; margin-top: 14px;
            padding: 12px 26px; border: none; border-radius: 14px;
            font-size: 15px; font-weight: 700; color: #fff; cursor: pointer;
            background: linear-gradient(140deg, #ef4444, #f97316);
            box-shadow: 0 10px 24px rgba(249, 115, 22, 0.3);
        }
        .btn:active { transform: translateY(1px); }
        a.link { display: inline-block; margin-top: 14px; color: #fbbf24; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge" aria-hidden="true">⛽</div>
        <h1>You are offline</h1>
        <p class="urdu">انٹرنیٹ کنکشن نہیں ہے — مہر فلنگ اسٹیشن ERP کو لائیو ڈیٹا کے لیے کنکشن چاہیے۔</p>
        <p>Bills, stock aur khata ka data hamesha server se fresh aata hai, is liye offline mode me purana data nahi dikhaya jata. Connection wapas aate hi dobara koshish karein.</p>
        <button class="btn" type="button" onclick="window.location.reload()">🔄 Dobara Koshish / Retry</button>
        <br>
        <a class="link" href="/dashboard">Dashboard par jayein →</a>
    </div>
    <script>
        window.addEventListener('online', function () { window.location.reload(); });
    </script>
</body>
</html>
